# MllyMed — nginx teskari proksi (TLS + gzip + xavfsizlik sarlavhalari)
# Backend ataylab 127.0.0.1:8200 da ishlaydi (kod o'zgarmaydi).
# /etc/nginx/sites-available/mllymed ga nusxa oling, server_name ni almashtiring,
# keyin: certbot --nginx -d mllymed.uz

limit_req_zone $binary_remote_addr zone=mllymed_api:10m rate=10r/s;

server {
    listen 80;
    server_name mllymed.uz www.mllymed.uz;   # ← domeningizni yozing

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api/ {
        limit_req zone=mllymed_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
